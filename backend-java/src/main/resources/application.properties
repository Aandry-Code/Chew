
# ==========================================
# PROYECTO CHEW - SPRING BOOT
# ==========================================

spring.application.name=chew
server.port=8081

# ==========================================
# IMPORTAR VARIABLES DEL ARCHIVO .env
# ==========================================

spring.config.import=file:./.env[.properties]

# ==========================================
# CONEXION A NEON POSTGRESQL
# ==========================================

spring.datasource.url=jdbc:postgresql://${PGHOST}:5432/${PGDATABASE}?sslmode=${PGSSLMODE}&channelBinding=${PGCHANNELBINDING}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CONFIGURACION DE JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=none
